<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="MicDrop: a handheld dictation mic dropping across a chest X-ray, with a foot pedal below">
  <defs>
    <radialGradient id="box" cx="62%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1d3640"/>
      <stop offset="0.55" stop-color="#11222a"/>
      <stop offset="1" stop-color="#0a1418"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#box)"/>
  <!-- film edge -->
  <rect x="10" y="10" width="1180" height="400" rx="12" fill="none" stroke="#2a434c" stroke-width="2"/>

  <!-- chest radiograph, right side -->
  <g stroke="#e6eef0" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.28" filter="url(#soft)">
    <path d="M840 40 L840 380" stroke-width="10"/>
    <path d="M832 70 C760 60 712 92 700 140 M848 70 C920 60 968 92 980 140" stroke-width="7"/>
    <path d="M832 110 C750 100 694 140 688 200 M848 110 C930 100 986 140 992 200" stroke-width="7"/>
    <path d="M832 150 C748 144 690 190 688 256 M848 150 C932 144 990 190 992 256" stroke-width="7"/>
    <path d="M832 190 C754 188 702 236 704 300 M848 190 C926 188 978 236 976 300" stroke-width="7"/>
    <path d="M832 230 C766 232 726 270 728 330 M848 230 C914 232 954 270 952 330" stroke-width="7"/>
    <path d="M832 270 C784 274 756 300 758 346 M848 270 C896 274 924 300 922 346" stroke-width="6"/>
    <path d="M760 52 C790 40 812 46 830 58 M920 52 C890 40 868 46 850 58" stroke-width="8"/>
    <path d="M700 60 L640 90 M980 60 L1040 90" stroke-width="9"/>
  </g>
  <!-- lung fields -->
  <g fill="#0a1418" opacity="0.35">
    <ellipse cx="760" cy="215" rx="62" ry="120"/>
    <ellipse cx="920" cy="215" rx="62" ry="120"/>
  </g>

  <!-- the dropping mic: handheld dictation mic seen on X-ray -->
  <g transform="translate(1010 150) rotate(28)" filter="url(#glow)">
    <rect x="-34" y="-110" width="68" height="220" rx="30" fill="#e6eef0" fill-opacity="0.10" stroke="#e6eef0" stroke-width="4"/>
    <g stroke="#e6eef0" stroke-width="3" opacity="0.8">
      <path d="M-18 -88 L18 -88 M-20 -78 L20 -78 M-20 -68 L20 -68 M-18 -58 L18 -58"/>
    </g>
    <circle cx="0" cy="-12" r="15" fill="none" stroke="#7fd0e6" stroke-width="4"/>
    <rect x="-18" y="18" width="14" height="10" rx="3" fill="#e6eef0" opacity="0.7"/>
    <rect x="4" y="18" width="14" height="10" rx="3" fill="#e6eef0" opacity="0.7"/>
    <rect x="-18" y="38" width="36" height="12" rx="4" fill="#f2c84b"/>
    <path d="M0 110 C0 140 -30 150 -50 170" stroke="#e6eef0" stroke-width="3" fill="none" opacity="0.6"/>
  </g>
  <!-- motion lines -->
  <g stroke="#7fd0e6" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M960 70 L1000 46"/>
    <path d="M944 100 L984 76"/>
    <path d="M986 40 L1018 20"/>
  </g>

  <!-- foot pedal, bottom right -->
  <g transform="translate(860 360)" stroke="#e6eef0" fill="#e6eef0" fill-opacity="0.07" stroke-width="3" opacity="0.85">
    <path d="M-150 30 C-150 10 -136 0 -116 0 L116 0 C136 0 150 10 150 30 L150 44 L-150 44 Z"/>
    <path d="M-132 0 C-132 -18 -120 -26 -100 -26 L-58 -26 C-44 -26 -38 -18 -38 -6 L-38 0"/>
    <path d="M-30 0 L-30 -30 C-30 -40 -24 -44 -14 -44 L14 -44 C24 -44 30 -40 30 -30 L30 0" stroke="#f2c84b"/>
    <path d="M38 0 C38 -18 44 -26 58 -26 L100 -26 C120 -26 132 -18 132 0"/>
  </g>

  <!-- PACS overlay text, corners -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#7fd0e6" font-size="15">
    <text x="36" y="44">Reading Room 1</text>
    <text x="36" y="64" fill="#8aa3ab">Study: hands-free dictation</text>
    <text x="1164" y="44" text-anchor="end">W 400 / L 40</text>
    <text x="1164" y="64" text-anchor="end" fill="#8aa3ab">Se 1 / Im 1</text>
    <text x="36" y="392" fill="#8aa3ab">PowerMic 0554:1001</text>
    <text x="200" y="392" fill="#8aa3ab">Foot pedal 05F3:00FF</text>
  </g>

  <!-- title block -->
  <g font-family="Barlow Condensed, Arial Narrow, Helvetica Neue, Arial, sans-serif">
    <text x="36" y="214" font-size="120" font-weight="700" fill="#e6eef0" letter-spacing="1">MicDrop</text>
    <text x="40" y="294" font-size="30" fill="#7fd0e6">Dictate from wherever your eyes are.</text>
    <text x="40" y="330" font-size="21" fill="#8aa3ab">PowerMic and foot pedal emulation for PowerScribe</text>
  </g>
  <!-- marker: yellow caliper under the title -->
  <g stroke="#f2c84b" stroke-width="3" stroke-linecap="round">
    <path d="M40 252 L404 252"/>
    <path d="M40 244 L40 260 M404 244 L404 260"/>
  </g>
</svg>
