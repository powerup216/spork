<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerMic tester, MicDrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link href="bs-theme.css" rel="stylesheet">
<script src="bs-skeletons.js" defer></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-size: 16px; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  .panel { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-top: 16px; }
  .connect { background: var(--lightbox); color: var(--lightbox-ink); border: 0; border-radius: 6px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .connect:hover { background: #a6e1f0; }
  .connect:focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }
  #status { margin-top: 12px; font-weight: 600; color: var(--muted); }
  #status.ok { color: #4cc283; }
  .grid { display: grid; gap: 10px; margin-top: 12px; }
  .tile { border: 1px solid var(--line); border-radius: 8px; padding: 12px; text-align: center; background: var(--film); }
  .tile small { display: block; color: var(--muted); font-size: .75rem; }
  .tile.on { background: var(--marker); color: #1b1600; border-color: var(--marker); box-shadow: 0 0 18px rgba(242, 200, 75, .45); }
  .tile.on small { color: #1b1600; }
  #log { font-size: .85rem; max-height: 220px; overflow: auto; color: var(--muted); white-space: pre-wrap; margin: 8px 0 0; font-family: inherit; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1 class="bs-title">MicDrop<small>PowerMic tester</small></h1>
  <p>Checks that the PowerMic buttons work, without PowerScribe. Set the device type to PowerMic II or PowerMic 4 and save. Works in Chrome, Edge and Firefox (Firefox needs the current MicDrop firmware).</p>
  <div class="panel">
    <button class="connect" id="connect">Connect PowerMic</button>
    <div id="status">Not connected.</div>
  </div>
  <div class="panel">
    <div class="grid" id="buttons" style="margin-top:0;grid-template-columns: repeat(auto-fill, minmax(150px, 1fr))"></div>
  </div>
  <div class="panel">
    <strong>Event log</strong>
    <pre id="log"></pre>
  </div>
  <p style="margin-top:16px"><a href="index.html">Back to the configurator</a></p>
</main>
<script>(()=>{
const C={first:"pm2",missing:"No PowerMic selected. Set the device type to PowerMic II or PowerMic 4, save, and try again.",kinds:{
pm2:{label:"PowerMic II",v:0x0554,q:0x1001,p:1,u:0,echo:1,names:["Transcribe","Previous Field","Dictate","Next Field","Rewind","Fast Forward","Stop/Play","Custom Left","Enter/Select","Custom Right"],
hid:(id,d)=>{const o=d.length===3?d:Uint8Array.from([0,...d]);return o[1]|(o[2]&63)<<8},serial:d=>d[1]|(d[2]&63)<<8},
pm4:{label:"PowerMic 4",v:0x0554,q:0x0064,p:0xffa0,u:1,echo:3,names:["Dictate",null,"Play/Pause","Tab Forward","Tab Backward","Rewind","Forward","Enter/Select",null,"Function A","Function B","Function C","Function D"],
hid:(id,d)=>d.length>=9?d[8]|d[7]<<8:null,serial:d=>d[8]|d[7]<<8}}};
const st=document.getElementById("status"),lg=document.getElementById("log"),grid=document.getElementById("buttons");
let kind=null,tiles=[],prev=0;
function log(t){lg.textContent=`${new Date().toLocaleTimeString()}  ${t}\n`+lg.textContent}
function useKind(k){if(kind===k)return;kind=k;grid.innerHTML="";prev=0;
tiles=C.kinds[k].names.map(n=>{if(!n)return null;const e=document.createElement("div");e.className="tile",e.textContent=n,grid.appendChild(e);return e})}
function show(bits){const names=C.kinds[kind].names;
tiles.forEach((e,i)=>e&&e.classList.toggle("on",!!(bits&1<<i)));
names.forEach((n,i)=>{if(!n)return;const b=1<<i;bits&b&&!(prev&b)&&log(`${n} pressed`),!(bits&b)&&prev&b&&log(`${n} released`)});prev=bits}
function connected(how){st.textContent=`Connected (${how}): ${C.kinds[kind].label}. Press a mapped key.`,st.className="ok",log("connected")}
useKind(C.first);
const hidKind=d=>{for(const k in C.kinds){const x=C.kinds[k];if(d.vendorId===x.v&&d.productId===x.q&&d.collections.some(c=>c.usagePage===x.p&&c.usage===x.u))return k}return null};
async function openHid(d){const k=hidKind(d);if(!k)return false;d.opened||await d.open();useKind(k);
d.addEventListener("inputreport",e=>{const o=new Uint8Array(e.data.buffer,e.data.byteOffset,e.data.byteLength),b=C.kinds[k].hid(e.reportId,o);b!==null&&show(b)});connected("USB");return true}
async function openSerial(){
const port=await navigator.serial.requestPort({filters:Object.values(C.kinds).map(x=>({usbVendorId:x.v,usbProductId:x.q}))});
await port.open({baudRate:115200});try{await port.setSignals({dataTerminalReady:true,requestToSend:true})}catch(e){}
const w=port.writable.getWriter();await w.write(Uint8Array.from([0x45,1]));w.releaseLock();
const info=port.getInfo?port.getInfo():{};for(const k in C.kinds){const x=C.kinds[k];if(x.v===info.usbVendorId&&x.q===info.usbProductId)useKind(k)}
connected("serial");const r=port.readable.getReader();let buf=[];
try{for(;;){const{value:v,done:dn}=await r.read();if(dn)break;for(const b of v)buf.push(b);
while(buf.length){if(buf[0]!==0x50){buf.shift();continue}if(buf.length<3)break;const n=buf[2];if(buf.length<3+n)break;const f=buf.splice(0,3+n);
for(const k in C.kinds)if(C.kinds[k].echo===f[1]){useKind(k);show(C.kinds[k].serial(Uint8Array.from(f.slice(3))))}}}}
catch(e){}st.textContent="Disconnected.",st.className="",log("disconnected")}
document.getElementById("connect").addEventListener("click",async()=>{
try{
if("hid"in navigator){const ds=await navigator.hid.requestDevice({filters:Object.values(C.kinds).map(x=>({vendorId:x.v,productId:x.q,usagePage:x.p,usage:x.u}))});
for(const d of ds)if(await openHid(d))return;if(ds.length)st.textContent=C.missing;return}
if("serial"in navigator){await openSerial();return}
st.textContent="This browser can't talk to USB devices. Use a recent Chrome, Edge or Firefox."
}catch(e){if(e.name!=="NotFoundError")st.textContent="Could not open the device: "+e.message}});
"hid"in navigator&&(navigator.hid.getDevices().then(async ds=>{for(const d of ds)if(await openHid(d))return}),
navigator.hid.addEventListener("disconnect",()=>{st.textContent="Disconnected.",st.className="",log("disconnected")}));
})();</script>
</body>
</html>
