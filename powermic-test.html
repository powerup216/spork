</head>

  <div class="panel">

  </div>
  <div class="panel">
    <div class="grid" id="buttons" style="margin-top:0;grid-template-columns: repeat(auto-fill, minmax(150px, 1fr))"></div>
  </div>
  <div class="panel">
    <strong>Event log</strong>

  </div>
  <p style="margin-top:16px"><a href="index.html">Back to the configurator</a></p>
</main>
